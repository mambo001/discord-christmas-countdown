name: Christmas Countdown

on:
  schedule:
    - cron: "0 8 * * *"
      timezone: "Asia/Manila"

  workflow_dispatch:

jobs:
  countdown:
    runs-on: ubuntu-latest

    steps:
      - name: Send Christmas countdown
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}

        run: |
          node <<'NODE'
          const TIMEZONE = "Asia/Manila";

          // ---------------------------------------
          // Calculate days until Christmas
          // ---------------------------------------

          const parts = Object.fromEntries(
            new Intl.DateTimeFormat("en-US", {
              timeZone: TIMEZONE,
              year: "numeric",
              month: "numeric",
              day: "numeric",
            })
              .formatToParts(new Date())
              .filter(({ type }) =>
                ["year", "month", "day"].includes(type)
              )
              .map(({ type, value }) => [type, Number(value)])
          );

          const today = Date.UTC(
            parts.year,
            parts.month - 1,
            parts.day
          );

          let christmas = Date.UTC(parts.year, 11, 25);

          if (today > christmas) {
            christmas = Date.UTC(parts.year + 1, 11, 25);
          }

          const days = Math.round(
            (christmas - today) / (1000 * 60 * 60 * 24)
          );

          // ---------------------------------------
          // Build increasingly festive message
          // ---------------------------------------

          let message;

          if (days === 0) {
            message = [
              "🎉🎊🎄🎁☃️ **MERRY CHRISTMAS!** ☃️🎁🎄🎊🎉",
              "",
              "🎅 🦌 ❄️ ⭐ 🎶 ✨ 🍪 🥛 🎁",
              "",
              "Hope everyone has an amazing Christmas! ❤️🎄"
            ].join("\n");

          } else if (days === 1) {
            message = [
              "🚨🎄🎁☃️ **CHRISTMAS IS TOMORROW!** ☃️🎁🎄🚨",
              "",
              "❄️ ⭐ 🎶 🎅 🦌 ✨ 🎁",
              "",
              "ONE. MORE. SLEEP. 😴🎄"
            ].join("\n");

          } else if (days <= 7) {
            message = [
              `🎄🎄🎄 **${days} DAYS UNTIL CHRISTMAS!** 🎄🎄🎄`,
              "",
              "🎁 ☃️ ❄️ ⭐ 🎶 🎅 🦌 ✨",
              "",
              "We're officially in Christmas week! 🎅"
            ].join("\n");

          } else if (days <= 29) {
            message = [
              `🎄🎁☃️❄️⭐ **${days} DAYS UNTIL CHRISTMAS!** ⭐❄️☃️🎁🎄`,
              "",
              "🎶 🎅 🦌 ✨ 🍪 🥛",
              "",
              "Christmas is getting close... 👀🎄"
            ].join("\n");

          } else if (days <= 99) {
            message = [
              `🎄🎁❄️ **${days} DAYS UNTIL CHRISTMAS!** ❄️🎁🎄`,
              "",
              "☃️ ⭐ 🎶 🎅 🦌"
            ].join("\n");

          } else {
            message = [
              `🎄 **${days} days until Christmas!** 🎄`,
              "",
              "❄️ 🎁 ⭐ ☃️ 🎶"
            ].join("\n");
          }

          // ---------------------------------------
          // Fetch a random Christmas GIF
          // ---------------------------------------

          async function getChristmasGif() {
            const searchTerms = [
              "christmas confetti",
              "merry christmas",
              "christmas celebration",
              "christmas snow",
              "christmas lights",
              "christmas tree",
              "christmas santa",
              "christmas party"
            ];

            // Pick a different search phrase each run
            const query =
              searchTerms[
                Math.floor(Math.random() * searchTerms.length)
              ];

            const url = new URL(
              "https://api.giphy.com/v1/gifs/search"
            );

            url.searchParams.set(
              "api_key",
              process.env.GIPHY_API_KEY
            );

            url.searchParams.set("q", query);
            url.searchParams.set("limit", "25");
            url.searchParams.set("rating", "g");

            const response = await fetch(url);

            if (!response.ok) {
              throw new Error(
                `GIPHY returned ${response.status}`
              );
            }

            const data = await response.json();

            if (!data.data?.length) {
              return null;
            }

            const gif =
              data.data[
                Math.floor(Math.random() * data.data.length)
              ];

            return gif.images.original.url;
          }

          let gifUrl = null;

          try {
            gifUrl = await getChristmasGif();
            console.log("GIF:", gifUrl);
          } catch (error) {
            // We still want the countdown to post even
            // if GIPHY happens to be unavailable.
            console.error(
              "Unable to fetch GIF:",
              error.message
            );
          }

          // ---------------------------------------
          // Create Discord payload
          // ---------------------------------------

          const embed = {
            description: message,
            timestamp: new Date().toISOString(),
            footer: {
              text: "🎄 Daily Christmas Countdown 🎄"
            }
          };

          if (gifUrl) {
            embed.image = {
              url: gifUrl
            };
          }

          const payload = {
            username: "Christmas Countdown 🎄",
            embeds: [embed]
          };

          // ---------------------------------------
          // Send to Discord
          // ---------------------------------------

          const response = await fetch(
            process.env.DISCORD_WEBHOOK_URL,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify(payload)
            }
          );

          if (!response.ok) {
            throw new Error(
              `Discord returned ${response.status}: ` +
              await response.text()
            );
          }

          console.log(
            `Successfully posted: ${days} days until Christmas`
          );
          NODE
