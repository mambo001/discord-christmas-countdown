name: Christmas Countdown

on:
  schedule:
    # Every day at 8:00 AM Philippine time
    - cron: "0 8 * * *"
      timezone: "Asia/Manila"

  # Lets you test it manually from GitHub
  workflow_dispatch:

jobs:
  countdown:
    runs-on: ubuntu-latest

    steps:
      - name: Send Christmas countdown
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

        run: |
          node <<'NODE'
          const TIMEZONE = "Asia/Manila";

          const parts = Object.fromEntries(
            new Intl.DateTimeFormat("en-US", {
              timeZone: TIMEZONE,
              year: "numeric",
              month: "numeric",
              day: "numeric",
            })
              .formatToParts(new Date())
              .filter(({ type }) =>
                ["year", "month", "day"].includes(type)
              )
              .map(({ type, value }) => [type, Number(value)])
          );

          const today = Date.UTC(
            parts.year,
            parts.month - 1,
            parts.day
          );

          let christmas = Date.UTC(parts.year, 11, 25);

          // After Christmas, count toward next Christmas
          if (today > christmas) {
            christmas = Date.UTC(parts.year + 1, 11, 25);
          }

          const days =
            Math.round((christmas - today) / (1000 * 60 * 60 * 24));

          let message;

          if (days === 0) {
            message = "🎄🎅 Merry Christmas! 🎁✨";
          } else if (days === 1) {
            message = "🎄 Only **1 day** until Christmas! 🎅";
          } else {
            message = `🎄 **${days} days** until Christmas! 🎅`;
          }

          const response = await fetch(process.env.DISCORD_WEBHOOK_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              content: message,
              username: "Christmas Countdown 🎄",
            }),
          });

          if (!response.ok) {
            throw new Error(
              `Discord returned ${response.status}: ${await response.text()}`
            );
          }

          console.log(message);
          NODE
